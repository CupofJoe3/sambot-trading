<!DOCTYPE html>
<html>
<head>
    <title>Quick Data Test</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        pre { background: #000; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>Firebase Data Test</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            output.innerHTML += '<div>' + msg + '</div>';
        }
        
        const app = firebase.initializeApp({databaseURL: 'https://sambot-tasks-default-rtdb.firebaseio.com'});
        const db = firebase.database();
        
        log('Loading status...');
        db.ref('trading/status').once('value').then(snap => {
            const data = snap.val();
            log('<h3>Status:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>');
        });
        
        log('Loading positions...');
        db.ref('trading/positions').once('value').then(snap => {
            const data = snap.val();
            log('<h3>Positions:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>');
        });
    </script>
</body>
</html>
